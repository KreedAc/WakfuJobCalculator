name: Update game data

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Dump sample raw items in the log'
        type: boolean
        default: false
  schedule:
    # First day of each month at 06:00 UTC — Wakfu patches land roughly monthly.
    - cron: '0 6 1 * *'

permissions:
  contents: write
  issues: write

jobs:
  sublimations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keep a copy of the current data for the patch diff
        run: |
          mkdir -p "$RUNNER_TEMP/prev-data"
          cp public/data/items.compact.*.json public/data/recipes.compact.json \
            public/data/sublimations.*.json public/data/wakfu_version.json "$RUNNER_TEMP/prev-data/"

      - name: Build localized sublimations from Ankama CDN
        run: node --max-old-space-size=4096 scripts/build-sublimations-data.mjs ${{ inputs.debug && '--debug' || '' }}

      - name: Build craft guide items and recipes from Ankama CDN
        run: node --max-old-space-size=4096 scripts/build-wakfu-data.mjs

      - name: Record what changed since the previous game version
        run: node scripts/build-patch-diff.mjs --prev "$RUNNER_TEMP/prev-data"

      - name: Open an issue for sublimations to add
        if: ${{ !inputs.debug }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only when this run recorded a new game version
          if git diff --quiet -- public/data/patch-diff.json; then exit 0; fi
          body=$(node -e "
            const d = require('./public/data/patch-diff.json').patches?.[0];
            const v = require('./public/data/wakfu_version.json').version;
            if (d && d.to === v && d.pendingSublimations?.length) {
              console.log('Wakfu ' + v + ' added sublimations that the site does not describe yet:\\n');
              for (const s of d.pendingSublimations) console.log('- **' + s.en + '** (FR ' + s.fr + ', ES ' + s.es + ', PT ' + s.pt + ') — item ' + s.id);
              console.log('\\nAdd them to public/data/sublimations.en.json (socket colors, values per level, rarity, obtainment, category); the next data update translates them.');
            }
          ")
          if [ -n "$body" ]; then
            gh issue create --title "New sublimations to add" --body "$body"
          fi

      - name: Show report summary
        run: |
          if [ -f scripts/sublimations.i18n.report.json ]; then
            node -e "const r=require('./scripts/sublimations.i18n.report.json');console.log('version:',r.version);console.log('matched:',r.matched+'/'+r.curatedCount);console.log('unmatched:',r.unmatched);console.log('partial placeholders:',r.partialPlaceholders.length)"
          fi

      - name: Commit updated data
        if: ${{ !inputs.debug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sublimations.*.json \
            public/data/items.compact.*.json public/data/recipes.compact.json \
            public/data/needed_item_ids.json public/data/missing_item_ids.json public/data/wakfu_version.json \
            public/data/patch-diff.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update game data from Ankama CDN"
            git push
          fi
